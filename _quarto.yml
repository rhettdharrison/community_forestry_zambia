project:
  type: website
  output-dir: docs
  resources:
    - images/
    - .nojekyll

execute:
  freeze: auto
  warning: false

website:
  title: "Community Forest Management in Zambia: Is it Working?"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Summary"
        href: Summary.qmd
      - text: "Recommendations"
        href: Recommendations.qmd
      - text: "Introduction"
        href: Introduction.qmd
      - text: "Survey Overview"
        href: "CFMG Survey.qmd"
      - text: "Governance"
        href: "CFMG Governance.qmd"
      - text: "Sustainable Forest Management"
        href: "CFMG SFM.qmd"
      - text: "Remote Sensing"
        href: "Remote Sensing.qmd"
      - text: "Economic Transformation"
        href: "CFMG ET.qmd"
      - text: "Equity and Inclusion"
        href: "CFMG BS.qmd"
      - text: "Discussion"
        href: Conclusions.qmd
      - text: "Bibliography"
        href: Bibliography.qmd
      - text: "Appendices"
        menu:
          - text: "Appendix I - Methods"
            href: Appendix_I-Methods.qmd
          - text: "Appendix II - Survey tool"
            href: Appendix_II-Survey_tool.qmd
          - text: "Appendix III - List of CFs surveyed"
            href: "Appendix_III-Surveyed_CFAs.qmd"
          - text: "Appendix IV - CFMG performance index scores"
            href: "Appendix_IV-Index_scores.qmd"

format:
  html:
    toc: true
    toc-location: left
    toc-depth: 3
    theme: cosmo
    css: custom.css
    append-hash: true
    include-before-body: title-banner.html
    include-after-body: sidebar-footer.html

filters:
  - mcanouil/collapse-output
